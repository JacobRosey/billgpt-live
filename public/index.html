<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill GPT</title>
    <link rel="icon" type="image/x-icon" href="oldglory.svg">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h2 class="title-text">BillGPT - Using OpenAI to Summarize U.S. Congress Bills</h2>
    <div class="container">
        <div class="sort-container">
            <span>Sort by:
                <button class="sort-btn sort-btn-active" id="recent" onclick="sortBills('recent')">Recent
                    Updates</button>
                <button class="sort-btn" id="passed" onclick="sortBills('passed')">Passed Bills</button>
                <button class="sort-btn" id="vetoed" onclick="sortBills('vetoed')">Vetoed Bills</button>
            </span>
            <span><input type="text" id="search" class="search-bar" placeholder="Search bills...">
                <button id="search-button" onclick="searchBills()">
                    <svg id="search-icon" class="search-icon" viewBox="0 0 24 24">
                        <path
                            d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                        <path d="M0 0h24v24H0z" fill="none" />
                    </svg>
                </button>
            </span>
            </span>
        </div>

        <div id="billList" class="bill-list">
            <!-- Bill list content will go here -->
        </div>

        <h5 class="title-text" style="color: #0056b3;">All bill data is received from <a
                href="https://legiscan.com/about" target="_blank">Legiscan</a>, then summarized using OpenAI's 4o-mini
        </h5>
    </div>


    <script type="module" src="index.js"></script>
</body>

</html>
